# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.github_token: '%env(default::GITHUB_TOKEN)%'
    app.max_commits_per_import: 1000

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/RepositoryInsights/Domain/Entity/'
            - '../src/RepositoryInsights/Domain/ValueObject/'
            - '../src/RepositoryInsights/Domain/Enum/'
            - '../src/RepositoryInsights/Domain/Exception/'
            - '../src/RepositoryInsights/Application/Dto/'
            - '../src/RepositoryInsights/Infrastructure/Web/Presentation/V1/Dto/'
            - '../src/RepositoryInsights/Application/UseCase/*/*Request.php'
            - '../src/RepositoryInsights/Application/UseCase/*/*Response.php'

    _instanceof:
        App\RepositoryInsights\Application\Service\CommitProvider:
            tags: ['app.commit_provider']

    App\RepositoryInsights\Application\Service\CommitProviderRegistry:
        arguments:
            $providers: !tagged_iterator app.commit_provider

    App\RepositoryInsights\Infrastructure\GitProvider\GitHub\GitHubGitProvider:
        arguments:
            $token: '%app.github_token%'

    App\RepositoryInsights\Domain\Repository\TrackedRepositoryRepository:
        alias: App\RepositoryInsights\Infrastructure\Doctrine\Repository\DoctrineTrackedRepositoryRepository

    App\RepositoryInsights\Domain\Repository\ContributorRepository:
        alias: App\RepositoryInsights\Infrastructure\Doctrine\Repository\DoctrineContributorRepository

    App\RepositoryInsights\Domain\Repository\CommitRepository:
        alias: App\RepositoryInsights\Infrastructure\Doctrine\Repository\DoctrineCommitRepository
