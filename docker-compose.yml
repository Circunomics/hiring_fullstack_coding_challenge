name: hiring-fullstack-final

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5434:5432"
    volumes:
      - test_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./source/backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-dev-only-change-me}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
      TEST_DATABASE_URL: "postgresql://app:app@test-database:5432/app_test?serverVersion=16&charset=utf8"
    depends_on:
      database:
        condition: service_healthy
      test-database:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./source/backend:/app
      - backend_vendor:/app/vendor

  frontend:
    build:
      context: ./source/frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5175:5173"
    volumes:
      - ./source/frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  db_data:
  test_db_data:
  backend_vendor:
  frontend_node_modules:
